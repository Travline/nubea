spring.application.name=backend
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
storage.s3.endpoint=${STORAGE_S3_ENDPOINT:http://localhost:9000}
storage.s3.region=${STORAGE_S3_REGION:us-east-1}
storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:nubea_admin}
storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:nubea_secret}
storage.s3.bucket=${STORAGE_S3_BUCKET:nubea}
storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:http://localhost:9000/nubea}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
banner.storage-prefix=banners/
banner.max-file-size=5242880
banner.allowed-mime-types=image/jpeg,image/png,image/webp,image/gif

# Vinculación OAuth y procesamiento son independientes de la habilitación de nuevos cobros.
mercadopago.pagos.enabled=${MERCADOPAGO_PAGOS_ENABLED:false}
mercadopago.pagos.checkout-enabled=${MERCADOPAGO_PAGOS_CHECKOUT_ENABLED:false}
mercadopago.pagos.store-origin=${MERCADOPAGO_PAGOS_STORE_ORIGIN:https://nubea.vercel.app}
mercadopago.pagos.tiendas=${MERCADOPAGO_PAGOS_TIENDAS:}
mercadopago.pagos.delay-ms=${MERCADOPAGO_PAGOS_DELAY_MS:5000}
mercadopago.notificaciones.enabled=${MERCADOPAGO_NOTIFICACIONES_ENABLED:false}
mercadopago.notificaciones.secret=${MERCADOPAGO_NOTIFICACIONES_SECRET:}
spring.task.scheduling.pool.size=2

# Vencimiento de reservas (siempre activo, con o sin pagos de Mercado Pago). Ver VencimientoReservasService.
# Gracia: minutos tras el vencimiento antes de cancelar una creación de orden incierta (las órdenes expiran a los 30 min).
reservas.vencimiento.delay-ms=${RESERVAS_VENCIMIENTO_DELAY_MS:60000}
reservas.vencimiento.gracia-minutos=${RESERVAS_VENCIMIENTO_GRACIA_MINUTOS:40}

# Inicio de sesión con Google (ID token de Google Identity Services). Vacío = deshabilitado (el endpoint responde 503).
google.client-id=${GOOGLE_CLIENT_ID:}
