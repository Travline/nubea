spring.application.name=backend

# Storage S3 compatible (RustFS local)
storage.s3.endpoint=http://localhost:9000
storage.s3.region=us-east-1
storage.s3.access-key=nubea_admin
storage.s3.secret-key=nubea_secret
storage.s3.bucket=nubea

# Banners
banner.storage.prefix=banners/
banner.max-file-size=5242880
banner.allowed-mime-types=image/jpeg,image/png,image/webp,image/gif
