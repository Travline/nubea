services:
  minio:
    image: minio/minio:latest
    container_name: local-minio
    restart: always
    ports:
      - "9000:9000" # Servicio
      - "9001:9001" # Gestor web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    container_name: local-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " until (/usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadminpassword) do echo 'Esperando a MinIO...' && sleep 1; done; /usr/bin/mc mb localminio/nubea || true; /usr/bin/mc anonymous set public localminio/nubea; exit 0; "

volumes:
  miniodata:
