
services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: nubea-storage
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: nubea_admin
      RUSTFS_SECRET_KEY: nubea_secret
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  create-bucket:
    image: public.ecr.aws/aws-cli/aws-cli:latest
    container_name: nubea-storage-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: nubea_admin
      AWS_SECRET_ACCESS_KEY: nubea_secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if ! aws s3api head-bucket \
          --bucket nubea \
          --endpoint-url http://rustfs:9000 2>/dev/null; then
          aws s3api create-bucket \
            --bucket nubea \
            --endpoint-url http://rustfs:9000
        fi
        echo "Bucket nubea listo"
    restart: "no"

volumes:
  rustfs_data:
